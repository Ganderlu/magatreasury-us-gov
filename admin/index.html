<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Our Maga Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .sidebar-item.active {
        background-color: rgba(255, 255, 255, 0.2);
      }
    </style>
    <!-- Firebase Dashboard Integration -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc,
        query,
        orderBy,
        limit
      } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDWGrKnD4wJTLL0EcOvQK_M_FEV9FqeP8o",
        authDomain: "magatreasure-4e9cf.firebaseapp.com",
        projectId: "magatreasure-4e9cf",
        storageBucket: "magatreasure-4e9cf.firebasestorage.app",
        messagingSenderId: "996309317077",
        appId: "1:996309317077:web:b253bceda52d501333795c",
        measurementId: "G-KTMZ6LPBGV"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      
      // Standard Firestore initialization
      const db = getFirestore(app);

      // Utility for status classes
      function getStatusClass(status) {
        switch (status) {
          case "pending_verification":
            return "bg-orange-100 text-orange-800";
          case "verified":
            return "bg-green-100 text-green-800";
          case "rejected":
            return "bg-red-100 text-red-800";
          default:
            return "bg-gray-100 text-gray-800";
        }
      }

      async function initAdmin() {
        try {
          console.log("Admin: Authenticating...");
          await signInAnonymously(auth);
          console.log("Admin: Authenticated anonymously");
          loadStats();
        } catch (err) {
          console.error("Admin: Authentication failed", err);
          document.getElementById("stat-sales").textContent = "Auth Error";
        }
      }

      async function loadStats() {
        try {
          console.log("Admin: Fetching data via Server API...");
          const response = await fetch('/api/admin/data');
          const result = await response.json();

          if (!result.success) {
            throw new Error(result.message || "Failed to fetch admin data");
          }

          const allItems = result.data.map(item => ({
            ...item,
            date: new Date(item.timestamp)
          }));

          console.log("Admin: Found", allItems.length, "total items");

          // Sort by date desc in memory
          allItems.sort((a, b) => b.date - a.date);

          let totalSales = 0;
          let totalOrders = allItems.length;
          let pendingOrders = 0;

          allItems.forEach(v => {
            const status = v.status || 'pending';
            if (status === "pending_verification" || status === "pending") pendingOrders++;
            if (status === "verified") totalSales += parseFloat(v.usdAmount || v.total || 0);
          });

          document.getElementById("stat-sales").textContent = `$${totalSales.toFixed(2)}`;
          document.getElementById("stat-orders").textContent = totalOrders;
          document.getElementById("stat-pending").textContent = pendingOrders;

          const recentList = document.getElementById("recent-orders-list");
          recentList.innerHTML = allItems
            .slice(0, 5)
            .map(
              (v) => `
                    <tr>
                        <td class="px-6 py-4 font-medium text-gray-900 text-xs">${v.id.substring(0, 8)}...</td>
                        <td class="px-6 py-4">
                          <div class="text-sm font-medium text-gray-900">${v.email}</div>
                          <div class="text-xs text-gray-500">${v.type}: ${v.coin || 'Checkout'}</div>
                        </td>
                        <td class="px-6 py-4 text-gray-500 text-sm">${v.date ? v.date.toLocaleDateString() : 'N/A'}</td>
                        <td class="px-6 py-4 font-semibold text-sm">$${parseFloat(v.usdAmount || v.total || 0).toFixed(2)}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-bold rounded-full ${getStatusClass(v.status || 'pending')}">${(v.status || 'pending').replace(/_/g, ' ')}</span>
                        </td>
                    </tr>
                `,
            )
            .join("");
        } catch (err) {
          console.error("Failed to load stats", err);
          document.getElementById("stat-sales").textContent = "Error";
        }
      }

      async function loadOrders() {
        try {
          console.log("Admin: Fetching all orders via Server API...");
          const response = await fetch('/api/admin/data');
          const result = await response.json();

          if (!result.success) {
            throw new Error(result.message || "Failed to fetch admin data");
          }

          const allItems = result.data.map(item => ({
            ...item,
            date: new Date(item.timestamp)
          }));

          // Sort by date desc in memory
          allItems.sort((a, b) => b.date - a.date);

          const list = document.getElementById("all-orders-list");
          list.innerHTML = allItems
            .map(
              (v) => `
                    <tr>
                        <td class="px-6 py-4 font-bold text-blue-600 text-xs">${v.id}</td>
                        <td class="px-6 py-4">
                            <div class="font-medium text-gray-900">${v.email}</div>
                            <div class="text-xs text-gray-500">${v.date ? v.date.toLocaleString() : 'N/A'}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-xs font-bold">${v.coinAmount || 'Checkout Order'}</div>
                            <div class="text-xs text-gray-500">${v.network || v.type}</div>
                            <div class="text-[10px] text-gray-400 break-all max-w-[150px]">${v.recipientAddress || ''}</div>
                        </td>
                        <td class="px-6 py-4 font-bold text-gray-900">$${parseFloat(v.usdAmount || v.total || 0).toFixed(2)}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-bold rounded-full ${getStatusClass(v.status || 'pending')}">${(v.status || 'pending').replace(/_/g, ' ')}</span>
                        </td>
                        <td class="px-6 py-4">
                            <select data-id="${v.id}" data-collection="${v.collection}" class="status-select bg-gray-50 border border-gray-300 text-gray-900 text-xs rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-1.5">
                                <option value="pending" ${v.status === "pending" || v.status === "pending_verification" || !v.status ? "selected" : ""}>Pending</option>
                                <option value="verified" ${v.status === "verified" ? "selected" : ""}>Verified</option>
                                <option value="rejected" ${v.status === "rejected" ? "selected" : ""}>Rejected</option>
                            </select>
                        </td>
                    </tr>
                `,
            )
            .join("");

          // Add event listeners to selects
          document.querySelectorAll('.status-select').forEach(select => {
            select.addEventListener('change', async (e) => {
              const id = e.target.dataset.id;
              const col = e.target.dataset.collection;
              const newStatus = e.target.value;
              await updateStatus(id, col, newStatus);
            });
          });
        } catch (err) {
          console.error("Failed to load orders", err);
        }
      }

      async function updateStatus(id, col, status) {
        try {
          const response = await fetch('/api/admin/update-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, collection: col, status })
          });
          
          const result = await response.json();
          if (!result.success) throw new Error(result.message);
          
          if (window.currentTab === "overview") loadStats();
          else loadOrders();
        } catch (err) {
          console.error("Error updating status:", err);
          alert("Failed to update status: " + err.message);
        }
      }

      // Global navigation
      window.currentTab = "overview";
      window.showTab = function(tab) {
        window.currentTab = tab;
        document
          .querySelectorAll(".tab-content")
          .forEach((el) => el.classList.add("hidden"));
        const contentEl = document.getElementById(`content-${tab}`);
        if (contentEl) contentEl.classList.remove("hidden");

        document
          .querySelectorAll(".sidebar-item")
          .forEach((el) => el.classList.remove("active"));
        const tabEl = document.getElementById(`tab-${tab}`);
        if (tabEl) tabEl.classList.add("active");

        const titleEl = document.getElementById("current-tab-title");
        if (titleEl) titleEl.textContent = tab.charAt(0).toUpperCase() + tab.slice(1);

        if (tab === "overview") loadStats();
        if (tab === "orders") loadOrders();
        if (tab === "products") {
          const listEl = document.getElementById("products-list");
          if (listEl) listEl.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Products management not yet integrated with Firebase</td></tr>`;
        }
      };

      window.logout = function() {
        window.location.href = "/";
      };

      window.updateStatus = updateStatus;

      // Initial load
      console.log("Starting dashboard...");
      initAdmin();
    </script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <!-- Dashboard Section -->
    <div id="admin-dashboard" class="flex">
      <!-- Sidebar -->
      <aside
        class="w-64 bg-slate-800 text-white min-h-screen flex flex-col fixed left-0 top-0"
      >
        <div class="p-6 border-b border-slate-700">
          <h1 class="text-xl font-bold tracking-tight">ADMIN PANEL</h1>
        </div>
        <nav class="flex-1 mt-4">
          <a
            href="#"
            onclick="showTab('overview')"
            class="sidebar-item flex items-center px-6 py-4 text-gray-300 active"
            id="tab-overview"
          >
            <i class="fas fa-chart-line w-6"></i> Overview
          </a>
          <a
            href="#"
            onclick="showTab('orders')"
            class="sidebar-item flex items-center px-6 py-4 text-gray-300"
            id="tab-orders"
          >
            <i class="fas fa-shopping-cart w-6"></i> Orders
          </a>
          <a
            href="#"
            onclick="showTab('products')"
            class="sidebar-item flex items-center px-6 py-4 text-gray-300"
            id="tab-products"
          >
            <i class="fas fa-box w-6"></i> Products
          </a>
          <a
            href="#"
            onclick="logout()"
            class="sidebar-item flex items-center px-6 py-4 text-gray-300 mt-auto"
          >
            <i class="fas fa-sign-out-alt w-6"></i> Logout
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 ml-64 p-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
          <h2 id="current-tab-title" class="text-3xl font-bold text-gray-800">
            Overview
          </h2>
          <div class="flex items-center space-x-4">
            <span class="text-gray-600">Admin User</span>
            <div
              class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold"
            >
              A
            </div>
          </div>
        </header>

        <!-- Tabs Content -->
        <div id="content-overview" class="tab-content">
          <!-- Stats Grid -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div
              class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500"
            >
              <div
                class="text-sm font-medium text-gray-500 uppercase tracking-wider"
              >
                Total Sales
              </div>
              <div
                id="stat-sales"
                class="text-3xl font-bold text-gray-800 mt-2"
              >
                $0.00
              </div>
            </div>
            <div
              class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500"
            >
              <div
                class="text-sm font-medium text-gray-500 uppercase tracking-wider"
              >
                Total Orders
              </div>
              <div
                id="stat-orders"
                class="text-3xl font-bold text-gray-800 mt-2"
              >
                0
              </div>
            </div>
            <div
              class="bg-white p-6 rounded-lg shadow-md border-l-4 border-orange-500"
            >
              <div
                class="text-sm font-medium text-gray-500 uppercase tracking-wider"
              >
                Pending Orders
              </div>
              <div
                id="stat-pending"
                class="text-3xl font-bold text-gray-800 mt-2"
              >
                0
              </div>
            </div>
          </div>

          <!-- Recent Orders -->
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div
              class="px-6 py-4 border-b border-gray-200 flex justify-between items-center"
            >
              <h3 class="text-lg font-bold text-gray-800">Recent Orders</h3>
              <button
                onclick="showTab('orders')"
                class="text-blue-600 hover:text-blue-800 font-medium text-sm"
              >
                View All
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead
                  class="bg-gray-50 text-gray-600 text-sm uppercase font-semibold"
                >
                  <tr>
                    <th class="px-6 py-3">ID</th>
                    <th class="px-6 py-3">Customer</th>
                    <th class="px-6 py-3">Date</th>
                    <th class="px-6 py-3">Total</th>
                    <th class="px-6 py-3">Status</th>
                  </tr>
                </thead>
                <tbody id="recent-orders-list" class="divide-y divide-gray-200">
                  <!-- Orders will be injected here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="content-orders" class="tab-content hidden">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead
                  class="bg-gray-50 text-gray-600 text-sm uppercase font-semibold"
                >
                  <tr>
                    <th class="px-6 py-3">ID</th>
                    <th class="px-6 py-3">Customer</th>
                    <th class="px-6 py-3">Items</th>
                    <th class="px-6 py-3">Total</th>
                    <th class="px-6 py-3">Status</th>
                    <th class="px-6 py-3">Actions</th>
                  </tr>
                </thead>
                <tbody
                  id="all-orders-list"
                  class="divide-y divide-gray-200 text-sm"
                >
                  <!-- Orders will be injected here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="content-products" class="tab-content hidden">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead
                  class="bg-gray-50 text-gray-600 text-sm uppercase font-semibold"
                >
                  <tr>
                    <th class="px-6 py-3">Image</th>
                    <th class="px-6 py-3">Product Name</th>
                    <th class="px-6 py-3">Price</th>
                    <th class="px-6 py-3">Actions</th>
                  </tr>
                </thead>
                <tbody
                  id="products-list"
                  class="divide-y divide-gray-200 text-sm"
                >
                  <!-- Products will be injected here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
