<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify your email</title>
  <style>
    :root {
      --shop-purple: #5a31f4;
      --bg-white: #ffffff;
      --text-dark: #000000;
      --text-muted: #616161;
      --input-bg: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: var(--text-dark);
    }
    .container { width: 100%; max-width: 500px; text-align: center; }
    h1 { font-size: 32px; font-weight: 700; margin: 0 0 12px 0; }
    .subtitle { color: var(--text-muted); font-size: 16px; margin-bottom: 40px; }
    .otp-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .otp-input {
      width: 48px; height: 56px;
      background-color: var(--input-bg);
      border: 2px solid transparent;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      outline: none;
    }
    .otp-input:focus { border-color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Verify your email</h1>
    <div class="subtitle">
      Enter code sent to <b id="email-display">your@email.com</b>
    </div>

    <div class="otp-container">
      <input type="text" class="otp-input" maxlength="1" autofocus />
      <input type="text" class="otp-input" maxlength="1" />
      <input type="text" class="otp-input" maxlength="1" />
      <span style="font-size:24px; color:#ccc;">•</span>
      <input type="text" class="otp-input" maxlength="1" />
      <input type="text" class="otp-input" maxlength="1" />
      <input type="text" class="otp-input" maxlength="1" />
    </div>

    <a href="/shop.html" style="color:#000; text-decoration:none;">Change email address</a>
  </div>

  <script>
    (function () {
      const emailDisplay = document.getElementById("email-display");
      const inputs = document.querySelectorAll(".otp-input");

      // Show saved email
      try {
        const savedEmail = localStorage.getItem("loginEmail");
        if (savedEmail) emailDisplay.textContent = savedEmail;
      } catch (e) {}

      inputs.forEach((input, index) => {
        input.addEventListener("input", async () => {
          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          const code = Array.from(inputs).map(i => i.value).join("");
          if (code.length === 6) {
            const email = localStorage.getItem("loginEmail");

            try {
              const res = await fetch("/api/verify-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, otp: code })
              });

              const data = await res.json();

              if (data.success) {
                localStorage.setItem("authToken", data.token);
                localStorage.setItem("userId", data.userId);
                window.location.href = "/orders.html";
              } else {
                alert(data.error || "Invalid code");
              }
            } catch (err) {
              alert("Network error. Is the server running?");
            }
          }
        });

        // Auto backspace
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Only numbers
        input.addEventListener("keypress", (e) => {
          if (!/[0-9]/.test(e.key)) e.preventDefault();
        });
      });
    })();
  </script>
</body>
</html>
