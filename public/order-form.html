<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Place Your Order</h1>
        <div id="feedback"></div>
        <form id="orderForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="deliveryDate">Delivery Date</label>
                <input type="date" id="deliveryDate" name="deliveryDate" required>
            </div>
            <div class="form-group">
                <label for="countryRegion">Country/Region</label>
                <input type="text" id="countryRegion" name="countryRegion" required>
            </div>
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="apartment">Apartment (Optional)</label>
                <input type="text" id="apartment" name="apartment">
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" name="state" required>
            </div>
            <div class="form-group">
                <label for="zipCode">Zip Code</label>
                <input type="text" id="zipCode" name="zipCode" required pattern="[a-zA-Z0-9\s-]{3,10}">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required pattern="^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$">
            </div>
            <button type="submit" id="submitBtn">Submit Order</button>
        </form>
    </div>

    <script>
        const orderForm = document.getElementById('orderForm');
        const feedback = document.getElementById('feedback');
        const submitBtn = document.getElementById('submitBtn');

        // Set min date for delivery to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('deliveryDate').setAttribute('min', today);

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            feedback.innerHTML = '';
            submitBtn.disabled = true;

            const formData = new FormData(orderForm);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    feedback.innerHTML = `<div class="alert alert-success">Order placed successfully! Order ID: ${result.id}</div>`;
                    orderForm.reset();
                } else {
                    const errors = result.errors ? result.errors.map(err => `<li>${err.msg || err.message}</li>`).join('') : result.message;
                    feedback.innerHTML = `<div class="alert alert-error">Error: <ul>${errors}</ul></div>`;
                }
            } catch (error) {
                feedback.innerHTML = `<div class="alert alert-error">Network error. Please try again later.</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
