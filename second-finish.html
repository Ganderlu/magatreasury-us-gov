<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enter code</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f6f7;
      --card: #ffffff;
      --text: #111827;
      --muted: rgba(17, 24, 39, 0.45);
      --border: rgba(17, 24, 39, 0.12);
      --shadow: 0 18px 60px rgba(17, 24, 39, 0.12);
      --radius: 12px;
      --primary: #005bd3;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 32px 28px;
    }
    .logo { display: flex; justify-content: center; margin-bottom: 24px; }
    .logo img { width: min(320px, 100%); height: auto; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    .sub { margin: 0 0 20px; font-size: 13px; color: #6b7280; }
    .input {
      width: 100%; height: 48px; border-radius: 8px;
      border: 1px solid #005bd3; padding: 0 12px;
      font-size: 16px; outline: none; text-align: center;
      letter-spacing: 4px; margin-bottom: 16px;
    }
    .btn {
      width: 100%; height: 48px; border-radius: 8px;
      border: 0; background: var(--primary); color: white;
      font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .alt-link {
      display: block; margin-top: 16px; font-size: 12px;
      color: #005bd3; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">
        <img src="https://cdn.shopify.com/s/files/1/0967/3775/5412/files/LIMITED_TIME_OFFER_3_x320.png?v=1772663214" alt="OUR MAGA SHOP">
      </div>

      <h1>Enter code</h1>
      <div class="sub">
        Sent to <span id="email-display">your@email.com</span>
      </div>

      <form id="otp-form">
        <input id="otp-input" class="input" type="text" inputmode="numeric" placeholder="6-digit code" maxlength="6" required autofocus />
        <button class="btn" type="submit">Submit</button>
      </form>

      <a class="alt-link" href="/login.html">Sign in with a different email</a>
    </div>
  </div>

  <script>
    (function () {
      const emailDisplay = document.getElementById("email-display");
      const otpInput = document.getElementById("otp-input");
      const form = document.getElementById("otp-form");

      // Show email
      const savedEmail = localStorage.getItem("loginEmail");
      if (savedEmail) emailDisplay.textContent = savedEmail;

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const code = otpInput.value.trim();
        const email = localStorage.getItem("loginEmail");

        if (code.length !== 6) {
          alert("Please enter 6 digits");
          return;
        }

        try {
          const res = await fetch("/api/verify-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, otp: code })
          });

          const data = await res.json();

          if (data.success) {
            localStorage.setItem("authToken", data.token);
            window.location.href = "/orders.html";
          } else {
            alert(data.error || "Invalid code");
          }
        } catch (err) {
          alert("Network error. Is the server running?");
        }
      });

      // Auto-submit when 6 digits entered
      otpInput.addEventListener("input", () => {
        if (otpInput.value.length === 6) {
          form.dispatchEvent(new Event("submit"));
        }
      });
    })();
  </script>
</body>
</html>
