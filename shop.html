<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Shop</title>
  <style>
    :root {
      --shop-purple: #5a31f4;
      --bg-gray: #f4f4f4;
      --text-dark: #000000;
      --text-muted: #616161;
      --border-color: #d1d1d1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: var(--text-dark);
    }
    .container { width: 100%; max-width: 400px; text-align: center; }
    h1 { font-size: 32px; font-weight: 700; margin: 0 0 8px 0; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
    form { display: flex; flex-direction: column; gap: 16px; }
    .input-field {
      width: 100%; height: 56px; border-radius: 28px;
      border: 1px solid var(--border-color); padding: 0 24px;
      font-size: 16px; outline: none; background-color: #f9f9f9;
    }
    .input-field:focus { border-color: var(--shop-purple); }
    .btn-continue {
      width: 100%; height: 56px; border-radius: 28px;
      background-color: var(--shop-purple); color: white;
      font-size: 16px; font-weight: 600; cursor: pointer;
      border: none;
    }
    .legal-text { margin-top: 40px; font-size: 11px; line-height: 1.6; color: #888888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sign in to Shop</h1>
    <div class="subtitle">To continue to <b>Our Maga Shop</b></div>

    <form id="shop-login-form">
      <input type="email" id="email-input" class="input-field" placeholder="Enter your email" required />
      <button type="submit" class="btn-continue">Continue</button>
    </form>

    <div class="legal-text">
      By continuing, you agree to Shop's terms and privacy policy.
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("shop-login-form");
      const emailInput = document.getElementById("email-input");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();

        if (!email) {
          alert("Please enter your email");
          return;
        }

        localStorage.setItem("loginEmail", email);

        try {
          const res = await fetch("/api/start-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
          });

          const data = await res.json();

          if (data.success) {
            window.location.href = "/finish.html";
          } else {
            alert(data.error || "Failed to send code");
          }
        } catch (err) {
          console.error(err);
          alert("Network error. Make sure server is running.");
        }
      });
    })();
  </script>
</body>
</html>
